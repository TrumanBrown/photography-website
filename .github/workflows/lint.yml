name: Lint and Type Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # exiftool lets the tests prove that removing a photo's location leaves
      # its image data byte for byte (scripts/location.test.mjs); without it
      # those tests are skipped.
      - name: Install exiftool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check
        continue-on-error: true

      - name: Astro type check
        run: |
          # Need at least one fixture session for astro check to validate the
          # collection schema. Synthesize without hitting Azure.
          node scripts/generate-fixtures.mjs
          npm run check
