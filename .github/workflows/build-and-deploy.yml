name: Build and Deploy

on:
  push:
    branches: [main]
    # Docs, license, and meta files don't change the built site, so skip the
    # full image build + deploy for commits that only touch them. The hourly
    # cron and manual dispatch are still available if a rebuild is ever wanted.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - '.github/SECURITY.md'
  pull_request:
    branches: [main]
    # `closed` lets close_pr tear the preview environment down; the build job
    # skips that event.
    types: [opened, synchronize, reopened, closed]
  schedule:
    # Hourly cron — picks up new blobs without any push.
    - cron: '0 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [blob-changed]

# Cancel older runs on the same ref when a new one arrives. Pull request runs
# group by their branch instead: when a PR is merged, GitHub gives the `closed`
# run main's ref, so grouping by github.ref let the preview teardown cancel the
# production deploy of the merge commit.
concurrency:
  group: build-and-deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write
  # Starts the photo pipeline (photos.yml) when a build finds new photos.
  actions: write

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: Build and deploy
    env:
      # Dependabot and fork PRs do not receive repository/Azure secrets. They
      # still run a complete fixture-backed build, but cannot sync photos or
      # create an SWA preview environment.
      CAN_USE_AZURE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Packages, and their install scripts, are installed before signing in to
      # anything.
      - name: Install npm deps
        run: npm ci

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Unit tests
        run: npm test

      - name: Cache apt packages (libraw-bin, exiftool)
        if: env.CAN_USE_AZURE == 'true'
        id: apt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-libraw-bin-exiftool-v3

      - name: Install image tools
        if: env.CAN_USE_AZURE == 'true'
        # libraw-bin: dcraw_emu for Sony/Nikon/Canon RAW
        # libimage-exiftool-perl: exiftool, which removes the GPS position
        #   from photos before they're published (scripts/location.mjs)
        # python3-pillow-heif: handles iPhone HDR HEIC (which heif-convert
        #   and ImageMagick's libheif delegate both fail to decode)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraw-bin \
            libimage-exiftool-perl \
            python3-pip
          # pillow-heif is pip-installable; --break-system-packages is fine on
          # the ephemeral runner.
          sudo pip install --break-system-packages --quiet pillow pillow-heif

      # Signs in as the build identity (Blob access on the site's storage
      # account only) once AZURE_DEPLOY_CLIENT_ID is set; see docs/cicd.md.
      - name: Azure login (OIDC)
        if: env.CAN_USE_AZURE == 'true'
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore prebuild cache
        if: env.CAN_USE_AZURE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/prebuild
          key: prebuild-cache-${{ github.run_id }}
          restore-keys: |
            prebuild-cache-

      # The build never calls a model. Captions and session descriptions are
      # written into _session.json by the photo pipeline (photos.yml), which
      # this step tells about new photos through its `new_photos` output.
      - name: Run prebuild (sync from Blob)
        if: env.CAN_USE_AZURE == 'true'
        id: prebuild
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: node scripts/prebuild.mjs

      - name: Save prebuild cache
        if: always() && env.CAN_USE_AZURE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/prebuild
          key: prebuild-cache-${{ github.run_id }}

      - name: Release prebuild cache disk space
        if: env.CAN_USE_AZURE == 'true'
        # Prebuild has copied these files into src/content; retaining both
        # copies exhausts the hosted runner while Astro populates dist/.
        run: rm -rf .cache/prebuild

      # Astro, Vite and their plugins run next. None of them needs Azure, so
      # they run signed out, like every package install.
      - name: Sign out of Azure for the build
        if: env.CAN_USE_AZURE == 'true'
        run: az logout

      - name: Generate local fixtures (secretless PR)
        if: env.CAN_USE_AZURE != 'true'
        run: node scripts/generate-fixtures.mjs

      - name: Restore Astro asset cache
        # .cache/astro holds Astro's optimized image variants. Persisting it
        # means only new/changed photos are re-encoded by sharp each build,
        # instead of regenerating every variant from scratch.
        # Astro never removes an entry, so the key changes when every variant
        # does: v2 started when prebuild began handing Astro 2400 px build
        # copies instead of the originals.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/astro
          key: astro-cache-v2-${{ github.run_id }}
          restore-keys: |
            astro-cache-v2-

      - name: Astro build
        env:
          # Links the site's footer to the Instagram account without naming it
          # in the repository. Secrets are masked in the log (docs/social.md).
          INSTAGRAM_URL: ${{ secrets.INSTAGRAM_URL }}
        run: npm run build

      - name: Azure login for the variant sync (OIDC)
        if: env.CAN_USE_AZURE == 'true'
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync image variants to Blob (keep SWA payload tiny)
        if: env.CAN_USE_AZURE == 'true'
        # Moves dist/_astro/*.{avif,webp,jpeg,jpg} to the `variants/` blob
        # container, rewrites HTML refs to the blob URL, and deletes the
        # variants from local dist. SWA deploy stays under 5 MB regardless
        # of how many photos are on the site.
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: node scripts/sync-variants.mjs

      - name: Stage staticwebapp.config.json into dist/
        # When skip_app_build is true, SWA treats app_location as the deploy
        # root. Astro doesn't copy non-public configs into dist/, so we put
        # the config alongside the built site here.
        run: cp staticwebapp.config.json dist/

      - name: Save Astro asset cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/astro
          key: astro-cache-v2-${{ github.run_id }}

      - name: Deploy to Azure Static Web Apps
        if: env.CAN_USE_AZURE == 'true'
        id: swa
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'dist'
          api_location: 'api'
          skip_app_build: true

      # New photos are live now, without captions. The photo pipeline analyses
      # them, writes their captions and the session description, and starts
      # another build when it's done (docs/photos.md).
      - name: Start the photo pipeline for new photos
        if: env.CAN_USE_AZURE == 'true' && github.event_name != 'pull_request' && steps.prebuild.outputs.new_photos != '' && steps.prebuild.outputs.new_photos != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run photos.yml --ref main --repo "$GITHUB_REPOSITORY"

  close_pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    name: Close PR preview
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
